name: Robot Incident Analyzer Alpha
on:
  push:
    branches: ['work/robot-incident-analyzer-alpha']
  pull_request:
    paths:
      - 'robot-incident-analyzer/**'
      - '.github/workflows/robot-incident-analyzer.yml'
jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: robot-incident-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: |
          python -m robot_incident_analyzer demo --output demo_tmp
          python -m robot_incident_analyzer analyze demo_tmp --output output_tmp
          test -f output_tmp/report.html
