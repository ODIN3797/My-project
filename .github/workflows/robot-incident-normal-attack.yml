name: Independent ROS2 normal-vs-attack bag validation
on:
  push:
    branches: ['work/robot-incident-analyzer-alpha']
    paths:
      - '.github/workflows/robot-incident-normal-attack.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-ros2-bags:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    defaults:
      run:
        working-directory: robot-incident-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Download independently published Zenodo ROS2 attack/normal dataset
        shell: bash
        run: |
          mkdir -p validation_real/input validation_real/output
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 100 \
            'https://zenodo.org/records/17649537/files/Experiment_1.zip?download=1' \
            --output validation_real/input/Experiment_1.zip
          file validation_real/input/Experiment_1.zip
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          p=Path('validation_real/input/Experiment_1.zip')
          with ZipFile(p) as z:
              entries=z.infolist()
              print('ZIP bytes:',p.stat().st_size,'Entries:',len(entries))
              for e in entries[:80]: print('ENTRY',e.filename,e.file_size)
              assert any(e.filename.lower().endswith(('.db3','.mcap')) for e in entries)
              for e in entries:
                  if e.is_dir(): continue
                  if '..' in Path(e.filename).parts: raise RuntimeError('Unsafe path')
                  if e.file_size>60_000_000: raise RuntimeError('Suspiciously large member')
                  if not e.filename.lower().endswith(('.db3','.mcap','.yaml','.yml')): continue
                  z.extract(e,'validation_real/input/extracted')
          PY
      - name: Evaluate independent normal and attack recordings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sqlite3, subprocess, json, hashlib
          root=Path('validation_real/input/extracted')
          bags=sorted(p for p in root.rglob('*') if p.suffix.lower() in ('.db3','.mcap'))
          if len(bags)<2: raise SystemExit('FAIL: expected at least two independent normal/attack recordings')
          summary={'source':'https://zenodo.org/records/17649537','scenario':'E1-1 normal vs E1-2 simulated 500Hz /input_joy/cmd_vel flood','label_provenance':'Zenodo publisher descriptions, not inferred','cases':[]}
          for i,p in enumerate(bags):
              out=Path('validation_real/output') / ('case_'+str(i+1))
              cmd=['python','-m','robot_incident_analyzer','field-validate',str(p),'--origin','unknown','--output',str(out)]
              run=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=70)
              print('ANALYZE',i,p,'returncode',run.returncode,run.stdout[:3000])
              case={'name':str(p.relative_to(root)),'size_bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'analyzer_returncode':run.returncode}
              if run.returncode not in (0,3): case['analysis_failed']=run.stdout[-3000:]
              if p.suffix.lower()=='.db3':
                  with sqlite3.connect(p) as con:
                      topics={int(id):{'name':name,'type':typ} for id,name,typ in con.execute('select id,name,type from topics')}
                      rows=con.execute('select topic_id,count(*),min(timestamp),max(timestamp) from messages group by topic_id').fetchall()
                  case['topics']=[{'name':topics[i]['name'],'type':topics[i]['type'],'messages':n,'span_s':round((end-start)/1e9,4),'mean_hz':round((n-1)/((end-start)/1e9),3) if end>start else None} for i,n,start,end in rows]
                  print('TOPICS',json.dumps(case['topics']))
              summary['cases'].append(case)
          output=Path('validation_real/output/COMPARISON.json')
          output.write_text(json.dumps(summary,indent=2))
          print('SUMMARY',output.read_text()[:16000])
          if any(c['analyzer_returncode'] not in (0,3) for c in summary['cases']):
              raise SystemExit('FAIL: one or more ROS2 bag analyses failed')
          PY
      - name: Upload evaluation results only (never raw rosbag)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-normal-attack-evaluation
          path: robot-incident-analyzer/validation_real/output/
          if-no-files-found: warn
