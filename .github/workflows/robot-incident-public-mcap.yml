name: Public MCAP format compatibility
on:
  pull_request:
    paths:
      - 'robot-incident-analyzer/**'
      - '.github/workflows/robot-incident-public-mcap.yml'
  push:
    branches: ['work/robot-incident-analyzer-alpha']
  workflow_dispatch:
jobs:
  public-mcap-compatibility:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: robot-incident-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Fetch independently published MCAP sample
        run: |
          mkdir -p public_data
          curl -fLSs --retry 2 --max-time 90 \
            'https://raw.githubusercontent.com/Hussain004/BAGEL/dc25e7ef395546bfbeea2ca07b71091fe70f5112/public/sample-bags/tour.mcap' \
            -o public_data/tour.mcap
          python - <<'PY'
          from pathlib import Path
          p = Path('public_data/tour.mcap')
          print('size:', p.stat().st_size)
          assert p.stat().st_size >= 1_000_000
          assert p.open('rb').read(8) == b'\x89MCAP0\r\n'
          PY
      - name: Run external-sample format compatibility assessment
        shell: bash
        run: |
          set +e
          python -m robot_incident_analyzer field-validate public_data/tour.mcap \
            --origin unknown --output public_data/results
          rc=$?
          set -e
          echo "Field-validation exit code: $rc (3 means needs human review)"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then exit "$rc"; fi
          test -f public_data/results/FIELD_RESULTS.md
          cat public_data/results/FIELD_RESULTS.md
      - name: Upload sample assessment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-mcap-compatibility
          path: robot-incident-analyzer/public_data/results/
          if-no-files-found: warn
